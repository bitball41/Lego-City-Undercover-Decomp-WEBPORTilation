<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEGO City Undercover</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #12151c;
      color: #f2efe6;
      font: 16px/1.4 "Trebuchet MS", sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; letter-spacing: 0.04em; }
    p { color: #c8c2b4; }
    canvas {
      width: min(100%, 960px);
      height: auto;
      background: #000;
      border: 4px solid #e8b423;
      display: block;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
    button, label.file {
      background: #e8b423;
      color: #1b1404;
      border: 0;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #status, #loadlabel { font-variant-numeric: tabular-nums; }
    #log { white-space: pre-wrap; color: #9aa4b5; font-size: 13px; }
    #loadbar {
      width: min(100%, 960px);
      height: 10px;
      background: #2a303c;
      margin: 8px 0;
    }
    #loadfill { height: 100%; width: 0; background: #e8b423; }
  </style>
</head>
<body>
<main>
  <h1>LEGO CITY UNDERCOVER</h1>
  <p>This page pulls the runtime and wasm straight from the GitHub repo, one chunk at a time, then boots. WASD moves, Shift sprints, Space jumps, mouse looks, Enter pauses. Drop your own <code>.ghg</code>, <code>.gsc</code>, or <code>.obj</code> files. No game assets are hosted here.</p>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadlabel">waiting</div>
  <canvas id="screen" width="480" height="270"></canvas>
  <div class="row">
    <label class="file">Stream a folder<input id="folder" type="file" webkitdirectory multiple hidden /></label>
    <button id="clear" type="button">Clear props</button>
    <span id="status">loading</span>
  </div>
  <div id="log"></div>
</main>
<script src="loader.js"></script>
<script src="shell.js"></script>
<script>
  const query = new URLSearchParams(location.search);
  LcuLoader.boot({
    repo: query.get("repo") || undefined,
    ref: query.get("ref") || undefined,
    base: query.get("dist") || undefined
  }).then(function (module) {
    LcuShell.start(module);
  }).catch(function (err) {
    document.getElementById("status").textContent = "load failed";
    document.getElementById("log").textContent = String(err && err.stack ? err.stack : err);
    if (query.has("smoke")) document.title = "LCU_FAIL";
  });
</script>
</body>
</html>
