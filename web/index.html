<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEGO City Undercover</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #12151c;
      color: #f2efe6;
      font: 16px/1.4 "Trebuchet MS", sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; letter-spacing: 0.04em; }
    p { color: #c8c2b4; }
    canvas {
      width: min(100%, 960px);
      height: auto;
      background: #000;
      image-rendering: auto;
      border: 4px solid #e8b423;
      display: block;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
    button, label.file {
      background: #e8b423;
      color: #1b1404;
      border: 0;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #status { font-variant-numeric: tabular-nums; }
    #log { white-space: pre-wrap; color: #9aa4b5; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>LEGO CITY UNDERCOVER</h1>
  <p>Browser port of the decomp. WASD moves, Shift sprints, Space jumps, mouse looks, Enter pauses. Drop your own dumped <code>.ghg</code>, <code>.gsc</code>, or <code>.obj</code> files and they stream in one at a time. This page does not ship game assets.</p>
  <canvas id="screen" width="480" height="270"></canvas>
  <div class="row">
    <label class="file">Stream a folder<input id="folder" type="file" webkitdirectory multiple hidden /></label>
    <button id="clear" type="button">Clear props</button>
    <span id="status">booting</span>
  </div>
  <div id="log"></div>
</main>
<script src="lcu.js"></script>
<script>
const BTN_A = 1 << 0;
const BTN_ZL = 1 << 6;
const BTN_PLUS = 1 << 8;
const BTN_UP = 1 << 10;
const BTN_DOWN = 1 << 11;
const BTN_LEFT = 1 << 12;
const BTN_RIGHT = 1 << 13;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const keys = new Set();
let lookX = 0;
let lookY = 0;
let module = null;
let image = null;

window.addEventListener("keydown", (ev) => { keys.add(ev.code); if (["Space","ArrowUp","ArrowDown"].includes(ev.code)) ev.preventDefault(); });
window.addEventListener("keyup", (ev) => keys.delete(ev.code));
canvas.addEventListener("mousemove", (ev) => {
  if (ev.buttons & 1) {
    lookX += ev.movementX * 0.004;
    lookY += ev.movementY * 0.004;
  }
});

function axis(neg, pos) { return (keys.has(pos) ? 1 : 0) - (keys.has(neg) ? 1 : 0); }

function samplePad() {
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  let lx = axis("KeyA", "KeyD") + axis("ArrowLeft", "ArrowRight");
  let ly = axis("KeyS", "KeyW") + axis("ArrowDown", "ArrowUp");
  let rx = Math.max(-1, Math.min(1, lookX));
  let ry = Math.max(-1, Math.min(1, lookY));
  let buttons = 0;
  if (keys.has("Space") || keys.has("KeyJ")) buttons |= BTN_A;
  if (keys.has("ShiftLeft") || keys.has("ShiftRight")) buttons |= BTN_ZL;
  if (keys.has("Enter") || keys.has("Escape")) buttons |= BTN_PLUS;
  if (keys.has("ArrowUp")) buttons |= BTN_UP;
  if (keys.has("ArrowDown")) buttons |= BTN_DOWN;
  if (keys.has("ArrowLeft")) buttons |= BTN_LEFT;
  if (keys.has("ArrowRight")) buttons |= BTN_RIGHT;
  lookX *= 0.8;
  lookY *= 0.8;
  if (gp) {
    lx = gp.axes[0] || lx;
    ly = -(gp.axes[1] || 0) || ly;
    rx = gp.axes[2] || rx;
    ry = gp.axes[3] || ry;
    if (gp.buttons[0] && gp.buttons[0].pressed) buttons |= BTN_A;
    if (gp.buttons[6] && gp.buttons[6].pressed) buttons |= BTN_ZL;
    if (gp.buttons[9] && gp.buttons[9].pressed) buttons |= BTN_PLUS;
  }
  return { buttons, lx, ly, rx, ry };
}

function present() {
  const w = module._host_fb_width();
  const h = module._host_fb_height();
  const ptr = module._host_framebuffer();
  if (!ptr || !w || !h) return;
  if (!image || image.width !== w || image.height !== h) {
    canvas.width = w;
    canvas.height = h;
    image = ctx.createImageData(w, h);
  }
  image.data.set(module.HEAPU8.subarray(ptr, ptr + w * h * 4));
  ctx.putImageData(image, 0, 0);
}

let last = performance.now();
let smokeFrames = 0;
const smoke = new URLSearchParams(location.search).has("smoke");
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const pad = samplePad();
  if (smoke) {
    module._host_set_pad(0, 0, 1, 0, 0);
  } else {
    module._host_set_pad(pad.buttons, pad.lx, pad.ly, pad.rx, pad.ry);
  }
  module._host_frame(dt);
  present();
  const text = module.UTF8ToString(module._host_get_status());
  statusEl.textContent = text + "  studs " + module._host_stud_count();
  if (smoke) {
    smokeFrames += 1;
    if (smokeFrames > 20) {
      document.title = text.indexOf("STUDS") >= 0 ? "LCU_OK" : "LCU_FAIL";
      return;
    }
  }
  requestAnimationFrame(frame);
}

async function streamFiles(fileList) {
  let ok = 0;
  for (const file of fileList) {
    if (!/\.(obj|ghg|gsc)$/i.test(file.name)) continue;
    const bytes = new Uint8Array(await file.arrayBuffer());
    const namePtr = module.lengthBytesUTF8(file.name) + 1;
    const np = module._malloc(namePtr);
    const bp = module._malloc(bytes.length);
    module.stringToUTF8(file.name, np, namePtr);
    module.HEAPU8.set(bytes, bp);
    ok += module._host_submit_asset(np, bp, bytes.length);
    module._free(np);
    module._free(bp);
    logEl.textContent = "streamed " + file.name + " (" + bytes.length + " bytes)";
    await new Promise((resolve) => requestAnimationFrame(resolve));
  }
  logEl.textContent += "\nmeshes accepted " + ok;
}

document.getElementById("folder").addEventListener("change", (ev) => {
  streamFiles(ev.target.files);
});
document.getElementById("clear").addEventListener("click", () => module && module._host_clear_assets());

createLcuModule().then((created) => {
  module = created;
  const lang = (navigator.language || "en-GB");
  const langPtr = module.lengthBytesUTF8(lang) + 1;
  const lp = module._malloc(langPtr);
  module.stringToUTF8(lang, lp, langPtr);
  module._host_set_language(lp);
  module._free(lp);
  module._host_boot();
  requestAnimationFrame(frame);
}).catch((err) => {
  statusEl.textContent = "boot failed";
  logEl.textContent = String(err);
});
</script>
</body>
</html>
